user_idea: |
  在沪深300历史成分股中研究“前30日低波动盘整、随后连续两日放量、第二日整根K线大于自身实体2倍”的日线策略。

  2015—2021用于准备指标和比较候选。2022—2024作为三段开发检查时期，必须完整报告，不能只挑表现好的时期。
  2025已经在旧事件报告里被看过，因此不算全新资料；当前循环仍不运行2025，也不根据2025修改规则。
  第2轮至第5轮允许根据2022—2024三段开发结果，每轮选择一个主要点继续检验；这三年都属于已看过的开发资料。
  已完成的第1轮基准结果是：2022年年化-4.73%、夏普-1.13；2023年年化17.82%、夏普1.25；
  2024年年化14.78%、夏普0.79。第2轮固定只把30日波动率上限从1.5%改为1.0%，其余条件完全不变，
  用正式三段回测检验旧事件线索，不能预先认定1.0%有效。第2轮不得再次请求逐事件附表或额外资料；
  现有OHLCV、历史成分、三段成绩和交易记录已经足够计算这个候选。若第2轮未被采用，后续回到1.5%基准，
  再从“持有5日改3日”或其他尚未测试的单项变化中选择一个，不得叠加1.0%与另一项变化。
  stock_kline_daily_qfq 的资料类型必须始终写成 time_series，字段为open、high、low、close、volume，
  股票范围对象固定为 {type: named_pool, value: hs300}；不得改写成panel。csi300_membership固定为static。
  基准版本始终是第1轮的1.5%波动率上限、持有5个完整交易日版本。后续候选只有完整开发报告passed=true时，
  才能替代基准成为下一轮起点；passed=false表示未采用，即使某些指标改善也必须丢弃，不得在它上面继续叠加条件。
  已完成的1.0%版本和3日持有版本完整报告均为passed=false，二者都未采用。
  第4轮必须回到第1轮基准，只增加D日close>open这一项；持有期恢复5日，波动率上限保持1.5%，其余不变。

  第1轮必须原样实现下面的固定版本，不得增加其他条件：
  - 信号日D是连续放量的第二天。
  - 盘整窗口是D-31至D-2，共30根该股票的有效日K线，不包含两个放量日。
  - 盘整波动率是这30根K线内部29个收盘收益率的样本标准差，首轮要求不高于1.5%。
  - 30日平均成交量使用同一窗口；D-1和D的成交量都必须不低于该均量的2倍。
  - 只检查第二天D：high-low > 2*abs(close-open)，并要求high>low。
  - 不要求阳线，不限定上影线或下影线。十字星只要high>low也可以入选。
  - 信号到D日收盘后才能确定，权重日期写D，由程序在下一实际交易日T开盘买入。
  - 从T开盘开始持有5个完整交易日，在第6个实际交易日开盘卖出。
  - 同一股票持有期间再次触发时忽略，不加仓，也不延长持有时间。
  - 每个决定日，对所有仍处于持有期的股票等权。单只股票最多10%，总股票权重不超过100%；不足部分留现金。
    当持仓数少于10只时，每只10%；达到10只及以上时，每只1/持仓数。
  - 股票在信号日D和买入日T都必须属于当时有效的沪深300历史成分股。
  - 每个实际交易日都要输出目标权重，保证到期股票能按时卖出；没有持仓时输出空权重或零权重。

  旧事件检查只能当作线索，不能当作本轮独立证明：
  - 全A股、波动率不高于1.5%的信号，5日逐事件扣费后平均收益约0.31%，但按信号日等权约为-0.16%。
  - 沪深300、波动率不高于1.0%的小组较好，但1.0%是看过多个数值后选出的，且2025表现为负。
  - 原事件检查是下一日开盘买、第5日收盘卖；本循环只能按开盘交易，所以两者成绩不能直接比较。

  从第2轮起，每轮只能改变一个主要点，并和最近一次被采用的版本比较。允许的单项变化只有：
  - 只改变盘整天数或波动率上限中的一个；
  - 只改变均量天数或放量倍数中的一个；
  - 只改变整根K线与实体的倍数；
  - 只增加或删除一种由第二天open、high、low、close计算的形态条件；
  - 只改变持有天数；
  - 只改变持仓分配办法。
  一轮不得同时改两个数值，也不得同时增加形态条件和改变持有天数。
  失败版本应丢弃，下一轮从最近一次被采用的版本继续。

  每轮必须完整报告2022—2024三段开发时期的信号数、交易数、年化收益、夏普、最大回撤、逐年收益、
  费用加倍结果和推迟一天买入结果。还要报告所有信号按日期等权后的结果，不能只看逐信号平均值。
  最终选择优先看三段夏普中位数、最差一段夏普、最大回撤和不同年份的一致性，不能只挑最好的一段。

  只能使用open、high、low、close、volume以及沪深300历史成分区间。
  严禁使用shift(-n)、未来收益、未来价格、未来成分名单或卖出结果来产生信号。
  买入日T的开盘价只能用于成交，不能用于筛选。
  禁止针对某个年份专门加条件，禁止隐藏表现差的年份，禁止直接修改已有回测结果文件。

experiment_name: consolidation_double_volume_long_bar_loop
train_start: "2015-01-05"
train_end: "2021-12-31"
validate_start: "2022-01-04"
validate_end: "2024-12-31"
development_start: "2022-01-04"
development_end: "2024-12-31"
backtest_start: "2025-01-02"
backtest_end: "2025-12-31"
final_test_start: "2025-01-02"
final_test_end: "2025-12-31"

universe:
  - symbols: hs300
    asset: 中国股票
    description: 沪深300历史成分股，信号日和下一实际交易日都按历史有效区间筛选

evaluation:
  min_sharpe_ratio: 0.50
  max_drawdown: 0.20
  min_return_rate: 0.00
  min_trade_count: 100

buy_cost: 0.0003
sell_cost: 0.0008
slippage: 0.00025
capital: 1000000
bar_interval: "1d"
development_folds: 3
gap_trading_days: 0
min_development_fold_days: 120
walk_forward_development: true
run_cost_stress: true
run_delay_stress: true
require_all_folds_beat_cash: true
min_fold_pass_ratio: 0.666666
min_worst_fold_sharpe: 0.0
min_cost_stress_sharpe: 0.0
min_delay_stress_sharpe: 0.0
max_single_change_ratio: 0.15
run_final_test: false
allow_final_test: false
