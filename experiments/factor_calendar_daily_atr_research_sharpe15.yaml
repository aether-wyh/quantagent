user_idea: |
  在沪深300历史成分股中继续研究日频选股策略。2022—2024是允许反复研究的开发时期。目标是三段逐年结果的夏普中位数至少1.50，至少两段各自达到1.50，最差一段夏普不得低于0，三段都要跑赢现金。2025-01-02至2025-12-31禁止运行、查看或用于修改规则。

  本实验承接已完成结果，不重复已经失败的候选：
  1. 增强时间重心偏离20日、TEMA20、Amihud20等权，20只、每5个实际交易日重新选择：2022、2023、2024夏普为-0.183367、0.606583、0.927196，中位数0.606583。
  2. 上述组合改为30只：三年夏普为-0.325245、0.544174、1.060502，中位数0.544174。30只只改善2024，拖累2022和2023。
  3. 增强时间重心偏离20日、TEMA20、价格时滞等权，30只：三年年化收益为-11.492672%、0.739124%、29.6644%，夏普为-0.637487、-0.020456、1.082810，中位数-0.020456。
  4. 第3项只把总分比例改为TEMA 25%、增强时间重心偏离40%、价格时滞35%：三年年化收益为-10.952273%、1.577836%、30.052561%，夏普为-0.598772、0.040090、1.067528，中位数0.040090。只改比例仍然失败，因此后续不得继续围绕价格时滞调权重。

  因子日历仅按2022—2024资料筛选后，HF0219平均真实波幅ATR14比价格时滞更稳定。ATR14低值策略三年收益为0.18%、4.75%、24.38%，三年相关值均为负；价格时滞同期收益为-7.41%、4.12%、11.91%。因此第1轮必须只把价格时滞替换为ATR14，其他规则保持第4项不变。

  第1轮固定使用以下三个因子：
  1. 增强时间重心偏离20日，高值优先。对每个实际交易日，只在当日有效历史成分股中做三次带常数项普通最小二乘，每次至少50只完整股票。先取gu_1m对rbar_up17、r_0931_1000、r_1001_1030、overnight_return的残差epsilon_up；再取gd_1m对rbar_down17、r_0931_1000、r_1001_1030、overnight_return的残差epsilon_down；最后取epsilon_down对epsilon_up的残差epsilon_final。逐股取最近连续20个实际交易日epsilon_final的简单平均，20日必须全部有效；缺少共有日期中的任一天即为空。回归失败或样本不足时当日全部为空。
  2. TEMA20，低值优先。逐股对close计算三层span=20、adjust=False指数平均，TEMA=3*E1-3*E2+E3。每层从第一个有效输入开始；close无效时不更新数值，且当日结果为空。
  3. HF0219平均真实波幅ATR14，低值优先。逐股按实际交易日计算TR=max(high-low, abs(high-前一实际交易日close), abs(low-前一实际交易日close))。没有前收或high、low、前收任一无效时TR为空。ATR使用N=14的EMA，alpha=2/(14+1)，从首个有效TR直接起算；TR无效时不更新此前ATR，且当日ATR为空。

  每个决定日D只用D及以前资料。候选股在D和下一实际交易日T都必须属于当时沪深300，且三个因子在D均有效。三个因子在候选股中分别按平均名次转为百分位：增强时间重心偏离高值优先，TEMA与ATR低值优先。第1轮总分固定为25%*TEMA百分位+40%*增强时间重心偏离百分位+35%*ATR百分位。每5个实际交易日重新选择总分最高的30只，同分时股票代码小者优先，每只目标权重1/30；不足30只时空余部分留现金。两次重新选择之间若股票退出沪深300，在第一个实际执行日把该股权重改为0，资金留现金，不补买。

  权重表trade_date必须写决定日D，由旧回测器在下一实际交易日T开盘执行。首行D是当次train_data_bundle行情最后一个实际交易日，对应validate_data_bundle第一个实际交易日T。此后每个检查日T都由它的前一实际交易日D生成一行权重。严禁把T写进权重表造成再次顺延，严禁读取T日行情来形成目标权重。

  旧框架会分别调用策略检查2022、2023、2024。代码不得写死某段的日期，也不得删除每段新增的训练资料；每次都要完整使用系统当次提供的train_data_bundle，再接当次validate_data_bundle。

  后续轮次每次只能改一个主要点：
  1. 第1轮只把价格时滞替换为ATR14，其他规则严格不变。
  2. 若第1轮未达到目标，第2轮优先只把持股数从30只改为20只、每只1/20；已有结果表明20只更有利于2022和2023。除非第1轮结果明确反对，才可改另一个单项，并说明数字依据。
  3. 若仍未达到目标，第3轮只能根据前三段实际结果改一个点，可选ATR窗口、TEMA窗口、增强时间重心偏离窗口、重新选择间隔、持股数、现金比例，或用一个因子日历候选替换当前一个因子。不得同时改两个点。
  4. 因子替换候选优先顺序为：HF0277多空指数BBI低值、HF0081成交量加权移动均线VAMA20低值、HF0088三角移动均线TMA20低值、HF0261一致交易TCV高值。BBI、VAMA、TMA与TEMA含义相近，同一版本不得同时加入两个此类均线因子。若公式资料不足，不得猜测，改选有明确公式的单项。
  5. 不得为单一年份增加专门条件，不得使用检查时期收益来估计该段参数，不得把失败版本的多个改动一次撤回并再加入新改动。

  所有版本只允许使用open、high、low、close、volume、amount、float_shares、gu_1m、gd_1m、rbar_up17、rbar_down17、r_0931_1000、r_1001_1030、overnight_return和历史成分区间。不得使用未来收益、负向位移或未来名单。若train_data_bundle或validate_data_bundle的stock_kline_daily_qfq出现2025-01-01及以后trade_date，必须立即报错停止，禁止先删除再计算。静态成分区间的end_date可以晚于2024，它只能用来判断D和T当天是否属于指数，不能因此拒绝资料，也不得读取T之后行情。2025起始日期必须在资料准备函数内部创建，不得在文件顶部创建全局日期值。所有版本必须输出每个实际检查日对应的决定日目标权重。

