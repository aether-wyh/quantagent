user_idea: |
  在沪深300历史成分股中继续研究日频选股策略。2022—2024是允许反复研究的开发时期，目标是三段逐年结果的夏普中位数至少1.50；至少两段各自达到1.50，最差一段夏普不得低于0，三段都要跑赢现金。2025-01-02至2025-12-31是保留时期，本实验禁止运行、查看或用于修改规则。

  本实验承接已经完成的参考版本，不再重复生成参考版本。参考版本在旧框架修正日期传递后得到：2022、2023、2024年化收益分别为-6.2366%、10.4961%、22.2641%，夏普分别为-0.32194、0.69037、0.87382，夏普中位数0.69037。参考版本的规则是ATR14低值、TEMA20低值、Amihud20高值等权，选20只，每5个实际交易日重新选择。另一个把TEMA改成close/TEMA20-1的候选只完成了代码检查，没有完成开发回测，不得把它当成有效证据。

  本实验第1轮必须直接检验“增强时间重心偏离20日 + TEMA20 + Amihud20”，不得重新生成ATR参考版本，也不得把TEMA改成close/TEMA20-1。三个因子定义如下：
  1. 增强时间重心偏离20日，高值优先。对每个实际交易日，仅在该日有效历史成分股中做三次带常数项的普通最小二乘，每次至少要有50只完整股票：先取gu_1m对rbar_up17、r_0931_1000、r_1001_1030、overnight_return的残差epsilon_up；再取gd_1m对rbar_down17、r_0931_1000、r_1001_1030、overnight_return的残差epsilon_down；最后取epsilon_down对epsilon_up的残差epsilon_final。逐股对epsilon_final取最近连续20个实际交易日的简单平均，20日必须全部有效；某只股票缺少全体股票共有日期表中的任一天也视为无效，不足20日不出值。回归失败、样本不足或矩阵无法求解时，当日该因子全部为空，不得使用未来数据补值。
  2. TEMA20低值优先。对close依次计算三层span=20、adjust=False指数平均，三层都从各自第一个有效输入开始；TEMA=3*E1-3*E2+E3。遇到无效值时不更新内部状态且当日结果为空。
  3. Amihud20高值优先。日值=abs(close.pct_change())/amount，必须使用真实amount且amount>0；最近连续20个实际交易日日值必须全部有效，再取简单平均。某只股票在全体股票共有日期表中缺少任一天行情，也要把该日视为无效。

  每个决定日D只使用D日及以前行情；权重在下一实际交易日T开盘执行，不得读取T日行情。候选股在D和T都必须属于当时的沪深300。三个因子在D日有效候选股中分别按平均名次转为百分位，方向必须是增强时间重心偏离高、TEMA低、Amihud高，再等权平均。每5个实际交易日重新选择总分最高的20只，每只5%。两次重新选择之间若股票退出沪深300，在退出后的第一个实际执行日把权重改为0，空出部分留现金，不补买。

  旧框架会对三个逐年向前检查段分别调用策略。策略代码禁止写死某一段的训练截止日、首个执行日或最后执行日，也禁止删掉每段新增的训练资料。每次调用必须完整使用系统当次提供的train_data_bundle作为指标历史，再接上当次validate_data_bundle；首个决定日取当次训练资料最后一个实际交易日，首个执行日取当次检查资料第一个实际交易日，最后执行日取当次检查资料最后一个实际交易日。三个检查段都必须独立生成权重并完成回测。

  后续轮次必须继续遵守一次只改一个主要点，顺序如下；只有上一轮实际结果明确否定下一项时才允许跳过，并必须解释证据：
  1. 第1轮只把参考版本的ATR替换为增强时间重心偏离20日；保留原始TEMA20低值、Amihud20高值、20只、5日重新选择和等权。
  2. 第2轮只把持股数从20只改为30只；每只权重相应改为1/30，其他规则不变。
  3. 第3轮只把Amihud替换为价格时滞；保留TEMA、增强时间重心偏离、30只、5日重新选择和等权。市场日收益用当日历史成分股有效收益等权计算；每个自然月最后一个实际交易日，对每只股票当月日收益分别回归于带常数项的市场当日收益，以及市场当日收益加前1至5日收益。两次回归使用同一批至少10个有效交易日，因子为1减去仅当日市场收益模型的R方除以完整模型R方，方向为低值优先。月末D日计算后，只能用于D日决定并在下一实际交易日执行，随后沿用到下一次月末更新。
  4. 第4轮只把三个因子权重从等权改为TEMA 25%、增强时间重心偏离40%、价格时滞35%。
  5. 若第4轮仍未达到目标，第5轮只能根据前三段结果再改一个因子方向、窗口、持股数、重新选择间隔或现金比例，不得同时改两项，不得针对单一年份增加多条条件。

  所有版本只允许使用open、high、low、close、volume、amount、float_shares、gu_1m、gd_1m、rbar_up17、rbar_down17、r_0931_1000、r_1001_1030、overnight_return和历史成分区间。不得使用未来收益、负向位移、未来名单、检查时期结果来估计该段参数，也不得读取2025资料。所有版本必须输出每个实际检查日的目标权重。

