user_idea: |
  在沪深300历史成分股中研究日频选股策略。2022—2024是允许反复研究的开发时期，目标是三段开发结果的夏普中位数至少1.50；至少两段各自达到1.50，最差一段夏普不得低于0，三段都要跑赢现金。2025-01-02至2025-12-31是保留时期，本轮禁止运行、查看或用于修改规则。

  第1轮先实现修正后的三因子参考版本，便于和已有结果比较。旧结果为三段年化收益-6.31%、9.19%、27.07%，夏普-0.34、0.59、1.03；它存在10个交易日资料空缺和TEMA起算不一致，因此这些旧数字只能说明2022段较弱，不能当作精确参考。

  参考版本使用以下固定定义：
  1. ATR14低值：逐股计算前收；前收缺失时TR必须为空，否则TR=max(high-low, abs(high-前收), abs(low-前收))。ATR是TR的span=14、adjust=False指数平均，从第一个有效TR开始，遇到无效值时不更新内部状态且当日结果为空。
  2. TEMA20低值：对close依次计算三层span=20、adjust=False指数平均，三层都从各自第一个有效输入开始，不得把每层都设为至少20条才出现；TEMA=3*E1-3*E2+E3。遇到无效值时不更新内部状态且当日结果为空。
  3. Amihud20高值：日值=abs(close.pct_change())/amount，必须使用真实amount且amount>0；20日值要求最近连续20个实际交易日的日值全部有效，再取简单平均。这里的“实际交易日”必须使用当前资料中全体股票共有的日期表；某只股票在其中一天没有行情行，也要把该日视为无效，不能简单取该股票最后20行跨过缺失日。
  每个决定日D只使用D日及以前行情；权重在下一实际交易日T开盘执行，不得读取T日行情。候选股在D和T都必须属于当时的沪深300。三个因子按横向平均名次转为百分位，方向为ATR低、TEMA低、Amihud高，等权平均；每5个实际交易日重新选择前20只，每只5%。两次重新选择之间若股票退出沪深300，在退出后的第一个实际执行日把权重改为0，空出部分留现金，不补买。

  旧框架会对三个逐年向前检查段分别调用策略。策略代码禁止把2021-12-31、2022-01-04或2024-12-31写成固定的本轮边界，也禁止把每段增加的训练资料删掉。每次调用都必须完整使用系统当次提供的train_data_bundle作为指标历史，再接上当次validate_data_bundle；首个决定日取当次训练资料最后一个实际交易日，首个执行日取当次检查资料第一个实际交易日，最后执行日取当次检查资料最后一个实际交易日。第一段才会对应2021-12-31决定、2022-01-04执行；第二、第三段必须自动使用各自资料中的日期。不得通过跳过缺失日期来绕开边界检查，三个检查段都必须能独立生成权重并完成回测。

  从第2轮起允许根据开发时期的分段结果研究因子和选股方法，但每轮只改一个主要点，并清楚写明采用或拒绝上一轮每项失败证据的理由。允许的单点变化包括：
  - 删除、替换或新增一个日频因子；可研究波动、趋势、反转、价格位置、流动性、换手率、市场Beta或下行风险。允许使用open、high、low、close、volume、amount、float_shares、gu_1m、gd_1m、rbar_up17、rbar_down17、r_0931_1000、r_1001_1030、overnight_return和历史成分区间，禁止查询未列出的字段。
  - 修改一个因子的方向、窗口或三因子权重；若需要估计方向、阈值或权重，只能使用当段训练时期，不能使用该段检查时期估计。
  - 修改一次持股数量、重新选择间隔或入选办法。
  - 新增一个只使用D日及以前资料的市场状态判断，并在不利时期提高现金比例。市场状态必须用当日历史成分股构造，不能使用未来名单或未来收益。
  不得在同一轮同时换因子、改权重、改持股数量和加择时；不得只为某一段成绩增加多条条件；不得根据2025资料做任何选择。

  第2轮优先检验一个能解释2022段亏损的单点变化；第3轮可尝试一个有经济理由的新信号或市场状态方法；第4轮做更简单的比较版本，删除一个作用存疑的因子或规则。若仍未达到夏普1.50，后续轮次继续按旧框架规定一次只改一个主要点。所有版本都必须输出每个实际检查日的目标权重，不能使用未来数据、负向位移、未来收益或假定成交结果。

  已有2022—2024资料给出的优先研究顺序如下；除非上一轮运行证据明确否定它，否则按顺序每轮只做一项：
  1. 第2轮只把ATR替换为“增强时间重心偏离20日”，保留TEMA、Amihud、20只、5日和等权。每个D日仅在D日有效历史成分股内做三次带常数项的普通最小二乘，每次至少要有50只完整股票：先取gu_1m对rbar_up17、r_0931_1000、r_1001_1030、overnight_return的残差epsilon_up；再取gd_1m对rbar_down17及相同三个时段收益的残差epsilon_down；最后取epsilon_down对epsilon_up的残差。逐股对最后这个残差取最近连续20个实际交易日的简单平均，20日必须全部有效；某只股票缺少全体股票日期表中的任一天也视为无效，不足20日不出值，方向为高值优先。
  2. 第3轮只把持股数从20只改为30只，其他规则不变。
  3. 第4轮只把Amihud替换为“价格时滞”，保留TEMA、增强时间重心偏离、30只和等权。市场日收益用当日历史成分股有效收益等权计算；每个自然月最后一个实际交易日，对每只股票当月日收益分别回归于带常数项的市场当日收益，以及市场当日收益加前1至5日收益。两次回归使用同一批至少10个有效交易日，因子为1减去仅当日市场收益模型的R方除以完整模型R方，方向为低值优先；月末D日计算后只能从下一实际交易日执行，并沿用至下一次月末计算。
  4. 第5轮只把三个因子权重从等权改为TEMA 25%、增强时间重心偏离40%、价格时滞35%。
  ATR与TEMA都含有明显的绝对价格影响，二者的历史五日相对收益高度相似；BBI、TMA、VAMA、TR、TCV也与这两类信号高度重复，本轮不要优先重复尝试。上述历史筛选仅用于确定候选顺序，是否达标必须以旧框架的三段开发结果为准。

