user_idea: |
  在沪深300历史成分股中继续研究日频选股策略。2022—2024是允许反复研究的开发时期，目标是三段逐年结果的夏普中位数至少1.50；至少两段各自达到1.50，最差一段夏普不得低于0，三段都要跑赢现金。2025-01-02至2025-12-31是保留时期，本实验禁止运行、查看或用于修改规则。

  本实验承接已经完成的有效结果，不重复旧候选：
  1. ATR14低值、TEMA20低值、Amihud20高值等权，20只，每5个实际交易日重新选择：2022、2023、2024年化收益为-6.2366%、10.4961%、22.2641%，夏普为-0.32194、0.69037、0.87382，夏普中位数0.69037。
  2. 把ATR替换为增强时间重心偏离20日，其他规则不变：三年年化收益为-3.417849%、9.311125%、25.129187%，夏普为-0.183367、0.606583、0.927196，中位数0.606583；成本加倍后的夏普中位数0.490302，延迟一天后的中位数0.562836。
  3. 在第2项基础上把持股数改为30只、每只1/30：三年年化收益为-5.921371%、8.274310%、28.0435%，夏普为-0.325245、0.544174、1.060502，中位数0.544174；成本加倍后的中位数0.440256，延迟一天后的中位数0.535551。该改动只改善2024，拖累2022和2023，未达到目标。

  前两次生成的价格时滞候选都在统计检查和回测前经人工对照原始因子代码发现错误，已停止且不得当成有效结果。第一次错误是把个股回归收益也按当日沪深300成分资格删减，导致月中刚纳入的股票丢失纳入前的当月历史收益。第二次已修正个股收益，但错误地在新月结果为空时继续沿用更早月份旧值，并把权重行日期写成执行日T，导致旧回测器再次顺延一天。原始因子定义只要求市场日收益按当日历史成分股筛选；个股被解释变量必须使用该股自身的原始有效日收益，不按成分资格再次删减。每到一个新月末，都必须用本月结果替换上月结果，包括空值。目标权重行必须写决定日D，由旧回测器在下一实际交易日T开盘执行。只有决定日和执行日的候选资格才需要当前成分身份。

  本实验第1轮必须直接检验修正后的“增强时间重心偏离20日 + TEMA20 + 价格时滞”组合，30只、每5个实际交易日重新选择、三因子等权。不得退回Amihud版本，也不得提前修改因子权重。三个因子如下：
  1. 增强时间重心偏离20日，高值优先。对每个实际交易日，仅在该日有效历史成分股中做三次带常数项的普通最小二乘，每次至少有50只完整股票：先取gu_1m对rbar_up17、r_0931_1000、r_1001_1030、overnight_return的残差epsilon_up；再取gd_1m对rbar_down17、r_0931_1000、r_1001_1030、overnight_return的残差epsilon_down；最后取epsilon_down对epsilon_up的残差epsilon_final。逐股对epsilon_final取最近连续20个实际交易日的简单平均，20日必须全部有效；股票缺少全体股票共有日期表中的任一天也视为无效。回归失败、样本不足或矩阵无法求解时，当日该因子全部为空。
  2. TEMA20低值优先。对close依次计算三层span=20、adjust=False指数平均，三层都从各自第一个有效输入开始；TEMA=3*E1-3*E2+E3。遇到无效值时不更新内部状态且当日结果为空。
  3. 价格时滞低值优先。先用每只股票相邻实际交易日close计算原始日收益stock_return。市场日收益只用该日有效历史成分股中日收益有效的股票等权平均。每个自然月最后一个实际交易日D，对每只股票当月的原始有效stock_return做两次带常数项回归；个股stock_return不得按该股当日是否属于沪深300删减。受限模型只含市场当日收益；完整模型含市场当日收益以及市场前1至5个实际交易日收益。两次回归必须先把个股收益和全部六个市场收益共同去除缺失值，使用完全相同的至少10个日期。两次回归都直接使用numpy.linalg.lstsq计算；即使解释变量矩阵的秩小于列数，也不得只因秩不足而把结果置空。个股收益总离差平方和不大于1e-12时该模型R2为空。因子=1-R2受限/R2完整；样本不足、计算失败或R2完整不大于1e-12时为空。月末D算出的值可以用于D日决定，并且只能在下一实际交易日T开盘执行。非月末沿用最近一个已完成月末的结果；但到达新的月末D时，必须用本月结果整体替换旧结果。如果某只股票本月结果为空，则从本月末D起该股因子为空，严禁继续沿用更早月份的旧值。不得提前在月内使用当月月末结果。

  每个决定日D只使用D日及以前行情；权重在下一实际交易日T开盘执行，不得读取T日行情。候选股在D和T都必须属于当时的沪深300。三个因子在D日有效候选股中分别按平均名次转为百分位，方向必须是增强时间重心偏离高、TEMA低、价格时滞低，再等权平均。每5个实际交易日重新选择总分最高的30只，每只1/30。两次重新选择之间若股票退出沪深300，在退出后的第一个实际执行日把权重改为0，空出部分留现金，不补买。输出权重表的trade_date必须写决定日D，绝不能写执行日T；旧回测器会把D行权重顺延到下一实际交易日T执行。首个权重行日期应为当次训练资料最后一个实际交易日D，对应检查资料第一个实际交易日T；此后每个检查日T也都由它的前一实际交易日D形成一行权重。若把T写入权重表会造成错误的双重延迟，必须拒绝。

  旧框架会对三个逐年向前检查段分别调用策略。策略代码禁止写死某一段的训练截止日、首个执行日或最后执行日，也禁止删掉每段新增的训练资料。每次调用必须完整使用系统当次提供的train_data_bundle作为指标历史，再接上当次validate_data_bundle；首个决定日取当次训练资料最后一个实际交易日，首个执行日取当次检查资料第一个实际交易日，最后执行日取当次检查资料最后一个实际交易日。三个检查段都必须独立生成权重并完成回测。

  后续轮次必须一次只改一个主要点，按以下顺序进行；只有上一轮实际结果明确否定下一项时才允许跳过，并必须说明证据：
  1. 第1轮直接检验修正后的价格时滞组合，三因子等权。
  2. 第2轮只把因子权重从等权改为TEMA 25%、增强时间重心偏离40%、价格时滞35%。
  3. 若第2轮仍未达到目标，第3轮只能根据三段实际结果改一个因子方向、窗口、持股数、重新选择间隔或现金比例，不得同时改两项，不得针对单一年份增加多条条件。
  4. 若第3轮仍未达到目标，第4轮仍只能改一个主要点，并优先检验上一轮结果直接支持的持有期、窗口、持股数或现金比例变化。
  5. 若第4轮仍未达到目标，第5轮仍只能改一个主要点，不得把2025资料作为选择依据。

  所有版本只允许使用open、high、low、close、volume、amount、float_shares、gu_1m、gd_1m、rbar_up17、rbar_down17、r_0931_1000、r_1001_1030、overnight_return和历史成分区间。不得使用未来收益、负向位移、未来名单、检查时期结果来估计该段参数，也不得读取2025资料。若train_data_bundle或validate_data_bundle的stock_kline_daily_qfq中出现任何2025-01-01及以后的trade_date，必须立即报错并停止，禁止先删除这些行情再继续计算。静态成分区间的end_date可以晚于2024，它只用于判断D和T当天是否属于指数，不得读取或使用T之后的行情。2025起始日期必须在资料准备函数内部创建，不得在文件顶部用pd.Timestamp等函数生成全局日期值，以免旧回测器漏掉该值。所有版本必须输出每个实际检查日对应的决定日目标权重。

