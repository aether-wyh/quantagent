user_idea: |
  多品种动量筛选+双均线+成交量确认策略, 日线级别.
  品种池(5个): AG88.SHFE (白银), I88.DCE (铁矿石), CU88.SHFE (铜), M88.DCE (豆粕), J88.DCE (焦炭).
  第一层：品种筛选（每日独立判断）:
  - 使用T-1日收盘价计算每个品种过去20个交易日的累计收益率(动量).
  - 只保留动量最高的前2个品种,其余品种当日不开仓.
  第二层：双信号确认（仅对筛选出的品种）:
  - 信号1(均线): 使用T-1日收盘价计算 MA5 和 MA20. 金叉(MA5上穿MA20)做多, 死叉做空.
  - 信号2(成交量): T-1日成交量必须大于过去20日均量,否则忽略本次信号.
  - 只有两个信号同时满足时，次日开盘才执行交易.
  仓位管理:
  - 总仓位上限60%, 剩余资金作为保证金安全垫.
  止损:
  - 开仓价反向波动超过2%时, 次日开盘平仓.
  

train_start: "2022-01-01"
