user_idea: |
  基于大盘+板块+个股三层过滤的短线轮动策略, 持仓5天.
  大盘因子: 用T-1日数据计算沪深300的20日均线斜率、全市场涨停占比、成交额5日均量比,加权评分,结合波动率惩罚决定仓位(满仓/半仓/空仓)。
  板块因子: 用T-1日数据筛选申万一级行业中5日涨幅前5、资金净流入、内部走势一致性高的行业,排除拥挤度过高或轮动过快的行业。
  个股因子: 在选定行业中,用T-1日数据计算5日动量、20日动量、量比、隔夜收益率等因子,综合打分取Top5,按1/log(i+2)权重分配。
  交易: 每日开盘买入,持仓5天卖出,每日再平衡,单次换手不超过40%。
  风控: 单票15%,行业25%，组合日回撤>2%次日减半仓。
  适用: 沪深300成分股,日线级别.
  [系统指令] 因子计算前先: close_prev=close.shift(1), volume_prev=volume.shift(1), 后续只用prev列. 严禁未来函数. 代码放在```python```中.

