user_idea: |
  基于大盘+板块+个股三层过滤的短线轮动策略, 持仓5天.
  1. 大盘因子(决定仓位):
     趋势(40%): 沪深300的20日均线斜率>0.5%得100分, -0.5%~0.5%得60分, <-0.5%得30分, 60日线下方得0分
     情绪(30%): 全市场涨停占比>1.5%得100分, 1%-1.5%得60分, 0.5%-1%得30分, <0.5%得0分; 炸板率>40%扣20分
     资金(30%): 全市场成交额5日均量比>1.2得100分, 0.8-1.2得60分, <0.8得30分; 北向连续3日净流入额外+10分
     波动率惩罚: 沪深300的20日波动率>历史75分位, 综合得分打8折
     仓位映射: >70满仓, 40-70半仓, <40空仓
  2. 板块因子(决定方向):
     - 申万一级行业5日涨幅排名前5
     - 行业5日资金净流入为正
     - 行业内个股5日涨幅标准差<均值+1倍标准差(排除假板块行情)
     - 行业拥挤度(成交占比/市值占比)在0.7-1.5之间
     - 行业轮动速度(10日排名变动)<80分位(避免追高轮动过快的行业)
     - 上游行业同步走强则加分(产业链验证)
  3. 个股因子(决定标的):
     - 5日动量(20%)+20日动量(10%)+量比(15%)+日内振幅(10%)+隔夜收益率(10%)+均线多头排列(10%)+个股与行业Beta(10%)+尾盘异动(10%)+流通市值(5%)
     - 剔除ST, 涨停股, 跌停股, 开盘低开>2%, 5日涨幅>20%的高位股
     - 综合打分取Top5, 按1/log(i+2)权重分配
     - Beta>1.3个股仅在大盘得分>70时纳入, Beta<0.8个股优先在大盘得分<50时纳入
  交易: 每日开盘买入, 持仓5天卖出, 每日再平衡, 单次换手不超过40%
  风控: 单票15%, 行业25%, 组合日回撤>2%次日减半仓, 大盘得分<30时空仓
  适用: 沪深300成分股, 日线级别, 三维多指标互验, 适应不同市场环境.
  [系统指令] 每次生成策略时, 必须将完整的Python代码放在```python代码块中, 否则无法解析.
